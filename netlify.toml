[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ==========================================================
# CANONICAL HOST: Redirect www to non-www (SEO best practice)
# ==========================================================
[[redirects]]
  from = "https://www.carpoolnetwork.co.uk/*"
  to = "https://carpoolnetwork.co.uk/:splat"
  status = 301
  force = true

# ==========================================================
# STATIC FILES: Serve robots.txt and sitemap.xml directly
# ==========================================================
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# ==========================================================
# SPA ROUTING: React Router fallback (must be after static files)
# ==========================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ==========================================================
# CACHE HEADERS: Aggressive caching for built assets
# ==========================================================
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Prevent caching of index.html to avoid stale app shell
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Prevent caching of service worker to avoid stale SW issues
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Static SEO files - moderate cache, allow revalidation, prevent MIME sniffing
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

# ==========================================================
# SECURITY HEADERS: Applied to all routes
# ==========================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # XSS Protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"
    
    # HSTS: Force HTTPS for 2 years + preload
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    
    # Permissions Policy: Disable unnecessary browser features
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()"

    # Cross-Origin policies
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

    # Content Security Policy — strict, no unsafe-inline for scripts
    # style-src 'unsafe-inline' is still required by Tailwind CSS and Framer Motion runtime styles.
    # img-src data: is required for inline base64 images (avatars, maps tiles).
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://browser.sentry-cdn.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://maps.googleapis.com https://maps.gstatic.com https://*.googleusercontent.com https://avatars.githubusercontent.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://accounts.google.com https://api.github.com https://sentry.io https://*.sentry.io https://maps.googleapis.com https://o*.ingest.sentry.io https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com https://github.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.supabase.co https://accounts.google.com https://github.com; frame-ancestors 'none'; upgrade-insecure-requests"

    # CORS: Only allow requests from our own origin
    Access-Control-Allow-Origin = "https://carpoolnetwork.co.uk"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Max-Age = "86400"

# ==========================================================
# SECURITY HEADERS: Service worker — prevent caching, restrict scope
# ==========================================================
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"
    Service-Worker-Allowed = "/"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"

# ==========================================================
# SECURITY HEADERS: SW cleanup script — no cache
# ==========================================================
[[headers]]
  for = "/sw-cleanup.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"
    X-Content-Type-Options = "nosniff"

# ==========================================================
# SECURITY HEADERS: Manifest — restrict to same-origin, prevent indexing
# ==========================================================
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json; charset=utf-8"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex"

# ==========================================================
# NETLIFY FUNCTIONS: Configuration
# ==========================================================
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Stripe webhook — raw body required for signature verification
[[redirects]]
  from = "/webhook/stripe"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true
